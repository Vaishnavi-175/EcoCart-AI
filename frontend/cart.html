<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EcoCart AI - Compare Cart</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --forest:#1B4332; --leaf:#2D6A4F; --sage:#74A892; --cream:#F7F5EF; --paper:#fff; --ink:#1C1C1C; --amber:#C77D2E; --clay:#B33A3A; --line:#E4E0D6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, sans-serif; background: var(--cream); color: var(--ink); }
  nav { padding: 12px 28px; background: var(--forest); border-bottom: 3px solid var(--leaf); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; max-width: 1080px; margin: 0 auto; width: 100%; }
  .logo { display: flex; align-items: center; gap: 9px; font-family: Georgia, serif; font-size: 1.15rem; color: var(--cream); text-decoration: none; }
  .logo-mark { width: 28px; height: 28px; border-radius: 7px; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo-mark svg { width: 16px; height: 16px; }
  .nav-links { display: flex; align-items: center; gap: 26px; font-size: 0.88rem; }
  .nav-links a { text-decoration: none; color: var(--cream); }
  .nav-links a:hover { color: var(--sage); }
  #userGreeting { color: var(--sage); font-size: 0.85rem; }

  main { max-width: 680px; margin: 0 auto; padding: 36px 20px 60px; }

  .panel { background: var(--paper); border-radius: 6px; padding: 22px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 26px; }
  .panel h2 { font-family: Georgia, serif; font-weight: normal; font-size: 1.05rem; color: var(--forest); margin-top:0; }
  label { display:block; font-size: 0.8rem; color:#555; margin: 12px 0 4px; }
  input, textarea { width:100%; padding: 9px 11px; border: 1.5px solid #ccc; border-radius: 4px; font-size: 0.92rem; font-family: Arial, sans-serif; }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, textarea:focus { outline: 2px solid var(--leaf); border-color: var(--leaf); }
  button { padding: 10px 18px; margin-top: 16px; background: var(--leaf); color:white; border:none; border-radius:4px; font-size:0.9rem; cursor:pointer; }
  button:hover { background: var(--forest); }
  button.remove-btn { background: transparent; color: var(--clay); padding: 4px 8px; margin-top:0; font-size:0.78rem; border: 1px solid var(--clay); }
  button.remove-btn:hover { background: #FBEAEA; }

  .msg { margin-top: 12px; font-size: 0.85rem; padding: 9px 12px; border-radius: 4px; display:none; }
  .msg.error { background:#FBEAEA; color:#7A2020; display:block; }
  .msg.success { background:#E7F3EA; color:#1B4332; display:block; }

  .savings-card {
    background: linear-gradient(135deg, var(--forest), #0F2A1E);
    color: var(--cream); border-radius: 10px; padding: 24px 26px; margin-bottom: 22px;
  }
  .savings-title { font-family: Georgia, serif; font-size: 1.1rem; margin-bottom: 4px; }
  .savings-sub { font-size: 0.8rem; color: #B9CFC1; margin-bottom: 18px; }
  .savings-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .savings-stat { text-align: center; }
  .savings-num { font-family: Georgia, serif; font-size: 1.7rem; }
  .savings-num.good { color: #7FD99A; }
  .savings-num.bad { color: #F0A0A0; }
  .savings-label { font-size: 0.7rem; color: #B9CFC1; margin-top: 2px; }
  .savings-note { font-size: 0.75rem; color: #9DB8AB; margin-top: 16px; line-height: 1.5; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 12px; }
  .savings-note b { color: #D9E8DE; }

  .chart-wrap { background: var(--paper); border-radius: 8px; padding: 20px 22px; margin-bottom: 22px; }
  .chart-wrap h3 { font-family: Georgia, serif; font-weight: normal; font-size: 1rem; color: var(--forest); margin: 0 0 4px; }
  .chart-wrap p { font-size: 0.78rem; color: #888; margin: 0 0 14px; }

  .summary { display:flex; justify-content: space-between; background: var(--forest); color: var(--cream); padding: 16px 20px; border-radius:6px; margin-bottom: 18px; font-size:0.9rem; }
  .summary strong { font-size: 1.1rem; }

  .cart-item { background: var(--paper); border-left: 5px solid var(--sage); border-radius: 4px; padding: 16px 18px; margin-bottom: 12px; }
  .cart-item.good { border-left-color: #2D6A4F; }
  .cart-item.medium { border-left-color: var(--amber); }
  .cart-item.poor { border-left-color: var(--clay); }
  .cart-item.unknown { border-left-color: #bbb; }
  .cart-item.worst { box-shadow: 0 0 0 2px var(--clay); }
  .item-top { display:flex; justify-content: space-between; align-items:flex-start; }
  .item-name { font-weight:bold; font-size: 1rem; }
  .worst-tag { font-size: 0.65rem; background: #FBEAEA; color: var(--clay); padding: 2px 8px; border-radius: 8px; margin-left: 8px; vertical-align: middle; }
  .item-price { color:#666; font-size:0.85rem; }
  .item-url { font-size: 0.75rem; color: var(--leaf); display: block; margin-top: 2px; }
  .item-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; margin-top: 8px; font-size: 0.8rem; }
  .item-detail-grid .k { color: #888; }
  .item-detail-grid .v { font-weight: bold; color: var(--ink); }
  .empty-note { color:#888; font-size:0.88rem; text-align:center; padding: 20px 0; }
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 3h2l2.4 12.2a1.5 1.5 0 0 0 1.5 1.3h8.6a1.5 1.5 0 0 0 1.5-1.2L20 8H6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="9" cy="20" r="1.2" fill="white"/>
          <circle cx="16" cy="20" r="1.2" fill="white"/>
          <path d="M13 5c0-1.7 1.3-3 3-3 0 1.7-1.3 3-3 3Zm0 0c0 1.7-1.3 3-3 3 0-1.7 1.3-3 3-3Z" fill="white"/>
        </svg>
      </span>
      EcoCart AI
    </a>
    <div class="nav-links">
      <a href="discover.html">Discover</a>
      <a href="checker.html">Checker</a>
      <a href="cart.html">Cart</a>
      <span id="userGreeting" style="display:none;"></span>
      <a href="login.html" id="loginLink">Log in</a>
      <a href="#" id="logoutLink" style="display:none;">Log out</a>
    </div>
  </div>
</nav>

<main>
  <div class="panel">
    <h2>Add a product</h2>
    <p style="font-family:Arial; font-size:0.82rem; color:#777; margin-top:-6px;">
      Copy the product title/description from Amazon, Flipkart, etc. and paste it below.
    </p>
    <form id="addForm">
      <label>Product name</label>
      <input type="text" id="product_name" placeholder="e.g. Men's Casual Cotton Shirt" required>

      <label>Product description (paste from site)</label>
      <textarea id="product_description" placeholder="e.g. 100% Cotton, regular fit, machine washable..."></textarea>

      <label>Product URL (optional)</label>
      <input type="text" id="product_url" placeholder="e.g. https://www.amazon.in/dp/...">

      <label>Price (₹)</label>
      <input type="number" id="price" placeholder="e.g. 899">

      <button type="submit">Add to cart</button>
    </form>
    <div class="msg" id="addMsg"></div>
  </div>

  <div id="savingsBox"></div>
  <div id="chartBox"></div>
  <div id="summaryBox"></div>
  <div id="cartList"></div>
</main>

<script>
const API = "https://ecocart-ai-backend.onrender.com";
let currentUser = null;
let cartChart = null;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function requireLogin() {
  const saved = localStorage.getItem("ecocart_user");
  if (!saved) {
    document.querySelector("main").innerHTML =
      `<div class="panel"><p>Please <a href="login.html">log in</a> to use your cart.</p></div>`;
    return null;
  }
  const user = JSON.parse(saved);
  document.getElementById("userGreeting").style.display = "inline";
  document.getElementById("userGreeting").textContent = "Hi, " + user.full_name;
  document.getElementById("loginLink").style.display = "none";
  document.getElementById("logoutLink").style.display = "inline";
  return user;
}
document.getElementById("logoutLink").addEventListener("click", function(e) {
  e.preventDefault();
  localStorage.removeItem("ecocart_user");
  window.location.href = "login.html";
});

function tierOf(score) {
  if (score === null || score === undefined) return { tier: "unknown", label: "Material not identified" };
  if (score >= 70) return { tier: "good", label: "Lower impact" };
  if (score >= 45) return { tier: "medium", label: "Moderate impact" };
  return { tier: "poor", label: "Higher impact" };
}

async function loadCart() {
  const res = await fetch(`${API}/cart/${currentUser.user_id}`);
  const items = await res.json();

  const savingsBox = document.getElementById("savingsBox");
  const chartBox = document.getElementById("chartBox");
  const summaryBox = document.getElementById("summaryBox");
  const cartList = document.getElementById("cartList");

  if (items.length === 0) {
    savingsBox.innerHTML = "";
    chartBox.innerHTML = "";
    summaryBox.innerHTML = "";
    cartList.innerHTML = `<p class="empty-note">Your cart is empty. Add a product above.</p>`;
    return;
  }

  const known = items.filter(i => i.carbon_footprint_kg_co2e_per_kg !== null && i.carbon_footprint_kg_co2e_per_kg !== undefined);

  let totalPrice = 0, totalScore = 0, knownCount = 0;
  items.forEach(i => {
    if (i.price) totalPrice += parseFloat(i.price);
    if (i.eco_score !== null && i.eco_score !== undefined) {
      totalScore += i.eco_score;
      knownCount++;
    }
  });
  const avgScore = knownCount ? Math.round(totalScore / knownCount) : null;

  let worstId = null, bestCarbon = null, worstCarbon = null;
  if (known.length > 0) {
    const sorted = [...known].sort((a, b) => a.eco_score - b.eco_score);
    worstId = sorted[0].cart_item_id;
    bestCarbon = Math.min(...known.map(i => parseFloat(i.carbon_footprint_kg_co2e_per_kg)));
    worstCarbon = Math.max(...known.map(i => parseFloat(i.carbon_footprint_kg_co2e_per_kg)));
  }

  if (known.length >= 2) {
    const actualTotalCarbon = known.reduce((s, i) => s + parseFloat(i.carbon_footprint_kg_co2e_per_kg), 0);
    const bestCaseTotalCarbon = bestCarbon * known.length;
    const worstCaseTotalCarbon = worstCarbon * known.length;
    const savedVsWorst = worstCaseTotalCarbon - actualTotalCarbon;
    const roomToImprove = actualTotalCarbon - bestCaseTotalCarbon;

    savingsBox.innerHTML = `
      <div class="savings-card">
        <div class="savings-title">Environmental Savings</div>
        <div class="savings-sub">Compared to if every item used the highest-impact material in this cart</div>
        <div class="savings-grid">
          <div class="savings-stat">
            <div class="savings-num good">${savedVsWorst.toFixed(1)}</div>
            <div class="savings-label">kg CO2e saved so far</div>
          </div>
          <div class="savings-stat">
            <div class="savings-num">${actualTotalCarbon.toFixed(1)}</div>
            <div class="savings-label">kg CO2e total (this cart)</div>
          </div>
          <div class="savings-stat">
            <div class="savings-num ${roomToImprove > 0.5 ? 'bad' : 'good'}">${roomToImprove.toFixed(1)}</div>
            <div class="savings-label">kg CO2e more to reach your best choice</div>
          </div>
        </div>
        <div class="savings-note">Based on the carbon range already present in your cart (best: <b>${bestCarbon.toFixed(1)} kg CO2e/kg</b>, worst: <b>${worstCarbon.toFixed(1)} kg CO2e/kg</b>). Swapping your highest-impact item for a material closer to your best choice would close this gap.</div>
      </div>`;
  } else {
    savingsBox.innerHTML = "";
  }

  if (known.length >= 1) {
    chartBox.innerHTML = `
      <div class="chart-wrap">
        <h3>Carbon footprint by item</h3>
        <p>Lower bars are better. Red dashed line marks the average.</p>
        <canvas id="cartCanvas" height="140"></canvas>
      </div>`;

    const labels = known.map(i => i.product_name.length > 18 ? i.product_name.slice(0, 18) + "…" : i.product_name);
    const values = known.map(i => parseFloat(i.carbon_footprint_kg_co2e_per_kg));
    const colors = known.map(i => {
      const t = tierOf(i.eco_score).tier;
      return t === "good" ? "#2D6A4F" : t === "medium" ? "#C77D2E" : "#B33A3A";
    });
    const avgCarbon = values.reduce((a, b) => a + b, 0) / values.length;

    if (cartChart) cartChart.destroy();
    const ctx = document.getElementById("cartCanvas").getContext("2d");
    cartChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels,
        datasets: [{
          label: "kg CO2e per kg",
          data: values,
          backgroundColor: colors,
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, title: { display: true, text: "kg CO2e / kg" } } }
      },
      plugins: [{
        id: "avgLine",
        afterDraw(chart) {
          const { ctx, chartArea, scales } = chart;
          const y = scales.y.getPixelForValue(avgCarbon);
          ctx.save();
          ctx.strokeStyle = "#B33A3A";
          ctx.setLineDash([5, 4]);
          ctx.beginPath();
          ctx.moveTo(chartArea.left, y);
          ctx.lineTo(chartArea.right, y);
          ctx.stroke();
          ctx.restore();
        }
      }]
    });
  } else {
    chartBox.innerHTML = "";
  }

  summaryBox.innerHTML = `
    <div class="summary">
      <div>Items: <strong>${items.length}</strong></div>
      <div>Total price: <strong>₹${totalPrice.toFixed(2)}</strong></div>
      <div>Avg. Eco Score: <strong>${avgScore !== null ? avgScore + '/100' : '—'}</strong></div>
    </div>
  `;

  cartList.innerHTML = items.map(i => {
    const t = tierOf(i.eco_score);
    const isWorst = i.cart_item_id === worstId && known.length >= 2;
    const materialName = i.detected_material ? i.detected_material.replace(/_/g, ' ') : 'Not identified';
    return `
      <div class="cart-item ${t.tier} ${isWorst ? 'worst' : ''}">
        <div class="item-top">
          <div>
            <div class="item-name">${esc(i.product_name)}${isWorst ? '<span class="worst-tag">Highest impact in cart</span>' : ''}</div>
            <div class="item-price">${i.price ? '₹' + esc(i.price) : ''}</div>
            ${i.product_url ? `<a class="item-url" href="${esc(i.product_url)}" target="_blank">View original →</a>` : ''}
          </div>
          <button class="remove-btn" onclick="removeItem(${i.cart_item_id})">Remove</button>
        </div>
        <div class="item-detail-grid">
          <div><span class="k">Material:</span> <span class="v">${esc(materialName)}</span></div>
          <div><span class="k">Impact:</span> <span class="v">${t.label}${i.eco_score !== null && i.eco_score !== undefined ? ' (' + esc(i.eco_score) + '/100)' : ''}</span></div>
          <div><span class="k">Carbon:</span> <span class="v">${i.carbon_footprint_kg_co2e_per_kg ? esc(i.carbon_footprint_kg_co2e_per_kg) + ' kg CO2e/kg' : 'N/A'}</span></div>
          <div><span class="k">Water:</span> <span class="v">${i.water_usage_l_per_kg ? esc(i.water_usage_l_per_kg) + ' L/kg' : 'N/A'}</span></div>
          <div><span class="k">Confidence:</span> <span class="v">${i.confidence_score !== null && i.confidence_score !== undefined ? esc(i.confidence_score) + '%' : 'N/A'}</span></div>
        </div>
      </div>
    `;
  }).join("");
}

async function removeItem(id) {
  await fetch(`${API}/cart/remove/${id}`, { method: "DELETE" });
  loadCart();
}

document.getElementById("addForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const product_name = document.getElementById("product_name").value.trim();
  const product_description = document.getElementById("product_description").value.trim();
  const product_url = document.getElementById("product_url").value.trim();
  const price = document.getElementById("price").value;
  const msg = document.getElementById("addMsg");

  try {
    const res = await fetch(`${API}/cart/add`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user_id: currentUser.user_id,
        product_name, product_description,
        price: price ? parseFloat(price) : null,
        product_url: product_url || null
      })
    });
    const data = await res.json();
    if (!res.ok) {
      msg.textContent = data.error || "Something went wrong";
      msg.className = "msg error";
      return;
    }
    msg.textContent = data.material_found
      ? `Added! Detected material: ${data.detected_material}`
      : `Added, but no material could be identified from the description.`;
    msg.className = "msg success";
    document.getElementById("addForm").reset();
    loadCart();
  } catch (err) {
    msg.textContent = "Can't reach the backend. Make sure app.py is running.";
    msg.className = "msg error";
  }
});

currentUser = requireLogin();
if (currentUser) loadCart();
</script>
</body>
</html>
